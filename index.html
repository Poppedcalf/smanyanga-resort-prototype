<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samanyanga Resort – Kariba (concept prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0a2252; --lake:#123f8c; --shallows:#7fb4b0; --mist:#eaf0fa;
  --gold:#e8a735; --gold-d:#b9791a; --bark:#4a3826; --white:#fbfcfb; --ink:#14201f;
  --serif:'Young Serif',Georgia,serif; --sans:'Figtree',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--white);line-height:1.55;font-size:17px;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{width:min(1080px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1}
h2{font-size:clamp(1.9rem,6vw,2.9rem);margin-bottom:.6em;max-width:16ch}
p{max-width:60ch}
section{padding:72px 0}

/* top bar */
.bar{position:absolute;inset:0 0 auto 0;z-index:5;padding:16px 0;color:#fff}
.bar .wrap{display:flex;justify-content:space-between;align-items:center}
.mark{width:48px;height:48px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;flex:none}
.logo{font-family:var(--serif);font-size:1.25rem;text-decoration:none;display:flex;gap:10px;align-items:center}
.bar nav{display:none;gap:26px;font-weight:500;font-size:.95rem}
.bar nav a{text-decoration:none;opacity:.9}
.bar nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:6px}
@media(min-width:760px){.bar nav{display:flex}}

/* hero */
.hero{position:relative;min-height:100svh;color:#fff;display:flex;align-items:flex-end;overflow:hidden;
  background:linear-gradient(180deg,#0a2252 0%,#1a3f86 28%,#c9803a 62%,#f0b957 70%,#123f8c 70.2%,#0a2a66 100%)}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:34%;background:linear-gradient(180deg,rgba(6,22,54,.65),transparent);z-index:1;pointer-events:none}
.sun{transform-origin:50% 50%;animation:rise 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.glint{animation:glint 5s ease-in-out infinite}
@keyframes glint{50%{opacity:.35}}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(180deg,transparent,rgba(6,22,54,.7) 62%);pointer-events:none}
@media(max-width:759px){.hero{background:var(--night)}.scene{height:84%;object-position:50% 20%}.hero::after{height:62%;background:linear-gradient(180deg,transparent,rgba(10,34,82,.88) 50%,var(--night) 72%)}}
.hero .wrap{position:relative;z-index:2;padding:0 0 88px}
.hero h1{font-size:clamp(2.6rem,11vw,6rem);max-width:11ch;margin-bottom:.35em;text-shadow:0 2px 24px rgba(13,42,48,.5)}
.hero p{font-size:1.15rem;color:#f3efe6;margin-bottom:28px;text-shadow:0 1px 12px rgba(13,42,48,.6)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:999px;font:600 1rem var(--sans);text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn.gold{background:var(--gold);color:var(--night)}
.btn.gold:hover{background:#f2b94d}
.btn.ghost{border-color:rgba(255,255,255,.7);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.dark{background:var(--night);color:#fff}

/* amenities */
.amen{background:var(--mist);padding:40px 0}
.amen ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px}
@media(min-width:760px){.amen ul{grid-template-columns:repeat(6,1fr)}}
.amen li{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-weight:600;font-size:.95rem}
.amen svg{width:34px;height:34px;stroke:var(--lake);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* rooms */
.tabs{display:flex;gap:8px;margin:8px 0 24px}
.tabs button{flex:1;max-width:150px;min-height:48px;border-radius:12px;border:2px solid var(--lake);background:none;color:var(--lake);font:600 1rem var(--sans);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--lake);color:#fff}
.room{display:none;grid-gap:24px}
.room.on{display:grid}
@media(min-width:760px){.room.on{grid-template-columns:1.2fr 1fr;align-items:center}}
.room .pic{aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,var(--shallows),var(--lake));position:relative}
.room .pic img{width:100%;height:100%;object-fit:cover;object-position:center 60%}
.badge{display:inline-block;background:var(--gold);color:var(--night);font-weight:700;font-size:.85rem;padding:4px 12px;border-radius:999px;margin-bottom:10px}
.room h3{font-size:1.8rem;margin-bottom:6px}
.room ul{padding-left:1.1em;margin:14px 0 20px}
.room li{margin:4px 0}
.rate{font-weight:700;color:var(--gold-d);margin-bottom:16px}

/* lake */
.lake{background:var(--night);color:#eaf2f0}
.lake h2{color:#fff}
.facts{display:grid;gap:28px;margin-top:36px}
@media(min-width:760px){.facts{grid-template-columns:repeat(3,1fr)}}
.facts h3{font-size:1.35rem;color:var(--gold);margin-bottom:6px}
.facts p{color:#c4d6d3}

/* gallery */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid button{border:0;padding:0;border-radius:14px;overflow:hidden;cursor:zoom-in;aspect-ratio:1;background:none}
.grid button{position:relative}
.grid button:nth-child(1){grid-column:span 2;aspect-ratio:2/1}
.grid button:nth-child(6),.grid button:nth-child(7),.grid button:nth-child(8){grid-column:span 2;aspect-ratio:2/1}
.grid button:nth-child(6) img{object-position:center 72%}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.grid img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.grid button:hover img{transform:scale(1.05)}
.grid button:nth-child(1) .cap{bottom:auto;top:10px}
.grid .cap{position:absolute;left:10px;bottom:10px;background:var(--gold);color:var(--night);font:700 .8rem var(--sans);padding:4px 10px;border-radius:999px}
dialog{border:0;border-radius:18px;padding:0;width:min(720px,94vw);overflow:hidden}
dialog::backdrop{background:rgba(13,42,48,.85)}
dialog img{width:100%;max-height:78vh;object-fit:contain;background:#000}
dialog form{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--white)}
.note{font-size:.9rem;color:#5b6b69;margin-top:14px}

/* reviews */
.rev{background:var(--mist)}
.quotes{display:grid;gap:16px;margin-top:20px}
@media(min-width:760px){.quotes{grid-template-columns:repeat(3,1fr)}}
.quotes blockquote{background:#fff;border-left:5px solid var(--gold);padding:20px;border-radius:0 14px 14px 0}
.quotes cite{display:block;margin-top:10px;font-style:normal;font-weight:600;font-size:.9rem;color:#5b6b69}

/* faq */
details{border-bottom:1px solid #cfdad7;padding:18px 0;max-width:720px}
summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;min-height:28px}
summary::after{content:"+";font-size:1.5rem;line-height:1;color:var(--lake);transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin-top:10px}

/* booking */
.book{background:linear-gradient(160deg,var(--lake),var(--night));color:#fff}
.book h2{color:#fff}
form.enq{display:grid;gap:14px;max-width:520px;margin-top:24px}
form.enq label{display:grid;gap:6px;font-weight:600;font-size:.95rem}
form.enq input,form.enq select{min-height:50px;border-radius:12px;border:2px solid transparent;padding:0 14px;font:1rem var(--sans);background:#fff;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.alt{margin-top:18px}
.alt a{font-weight:600}

footer{background:#061636;color:#9bb3b0;padding:36px 0 110px;font-size:.9rem}
footer .logo{color:#fff;margin-bottom:10px}

/* sticky whatsapp */
.wa{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;gap:10px}
.wa a{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 20px;border-radius:999px;background:#1fa855;color:#fff;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.wa a.call{background:var(--night);width:56px;padding:0;justify-content:center}
.wa svg{width:26px;height:26px;fill:#fff}
.wa a.call svg{fill:none;stroke:#fff;stroke-width:2}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
